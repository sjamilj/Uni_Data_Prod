  <h1>Tuition fee deposit</h1>
  <p>The minimum tuition fee deposit for applicants from Bangladesh is £4,000 for undergraduate, postgraduate and Essex Abroad courses.</p>
  <p>The deposit must be paid before a Confirmation of Acceptance for Studies (CAS) is issued and is deducted from the first tuition fee instalment.</p>
