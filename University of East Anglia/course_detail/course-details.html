teractive/2023/sep/09/the-guardian-university-guide-2024-the-rankings" class="text-sm hover:underline focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500" aria-label="Learn more about Top 20">Guardian University Guide 2024</a></div></div></section><main id="main_content" class="px-4 py-8 sm:px-8 md:px-20 lg:px-24"><div><section class="section-panel" id="course_overview" data-algolia-index="true"><div class="grid grid-cols-[auto_1fr] items-start gap-x-3"><svg viewBox="0 0 10 10" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" class="block w-7 sm:w-10 bg-bulrush-green"><path d="M4.373,9.015c0-3.54-.841-4.297-4.373-4.335v-.345C3.532,4.335,4.335,3.54,4.373,0h.337c0,3.54.833,4.297,4.365,4.328v.352c-3.532,0-4.327.795-4.365,4.335h-.337Z" transform="translate(.4625 0.4925)" clip-rule="evenodd" fill="#000000ff" stroke-linejoin="round" stroke-miterlimit="1.41421"></path></svg><div><h2 class="mb-1 text-2xl font-semibold sm:text-4xl">Course Overview</h2><hr class="w-32 mb-6 bg-bulrush-green" style="height:2px"></div></div><div><div class="OutlineElement Ltr SCXW212166271 BCX4">
<p class="Paragraph SCXW212166271 BCX4"><strong><span class="TextRun SCXW212166271 BCX4" lang="EN-US" xml:lang="EN-US" data-contrast="none"><span class="NormalTextRun SCXW212166271 BCX4">Why</span> </span><span class="NormalTextRun SCXW212166271 BCX4">MSc Economics</span> <span class="NormalTextRun SCXW212166271 BCX4">at UEA?</span><span class="EOP Selected SCXW212166271 BCX4" data-ccp-props="{&quot;335559738&quot;:240,&quot;335559739&quot;:240}">&nbsp;</span></strong></p>
</div>
<div class="OutlineElement Ltr SCXW212166271 BCX4">
<p class="Paragraph SCXW212166271 BCX4"><span class="TextRun SCXW212166271 BCX4" lang="EN-GB" xml:lang="EN-GB" data-contrast="auto"><span class="NormalTextRun SCXW212166271 BCX4">A</span><span class="NormalTextRun SCXW212166271 BCX4">lready studied economics and looking for intensive research-led training in advanced economic theory</span><span class="NormalTextRun SCXW212166271 BCX4">? Try this rewarding course, which is</span><span class="NormalTextRun SCXW212166271 BCX4"> part of our Academic and Professional Programme</span><span class="NormalTextRun SCXW212166271 BCX4">.</span></span><span class="EOP Selected SCXW212166271 BCX4" data-ccp-props="{&quot;134233117&quot;:false,&quot;134233118&quot;:false,&quot;201341983&quot;:0,&quot;335551550&quot;:1,&quot;335551620&quot;:1,&quot;335559685&quot;:0,&quot;335559737&quot;:0,&quot;335559738&quot;:240,&quot;335559739&quot;:240,&quot;335559740&quot;:276}">&nbsp;</span></p>
</div>
<div class="ListContainerWrapper SCXW212166271 BCX4">
<div class="impact-bullets colour-green"><h3 class="impact-bullets__title">Why Choose UEA</h3><ul class="impact-bullets__list"><li class="impact-bullets__item"><strong>Core Economics Training</strong>: Gain a thorough grounding in both Economic Theory and Econometrics, as a solid preparation for a career as a professional economist</li><li class="impact-bullets__item"><strong>Learn from professionals</strong>: Benefit from teaching by leading researchers in economic theory and econometrics</li><li class="impact-bullets__item"><strong>AI for positive impact</strong>: Learn how to harness AI’s capabilities in positive, constructive ways in the advanced study of Economics</li></ul></div>
</div>
<div class="OutlineElement Ltr SCXW212166271 BCX4">
<p class="Paragraph SCXW212166271 BCX4"><strong><span class="TextRun SCXW212166271 BCX4" lang="EN-US" xml:lang="EN-US" data-contrast="none"><span class="NormalTextRun SCXW212166271 BCX4">What</span><span class="NormalTextRun SCXW212166271 BCX4"> is </span></span><span class="NormalTextRun SCXW212166271 BCX4">MSc Economics</span><span class="NormalTextRun SCXW212166271 BCX4">?</span><span class="EOP Selected SCXW212166271 BCX4" data-ccp-props="{&quot;335559739&quot;:160}">&nbsp;</span></strong></p>
</div>
<div class="OutlineElement Ltr SCXW212166271 BCX4">
<p class="Paragraph SCXW212166271 BCX4"><span class="TextRun SCXW212166271 BCX4" lang="EN-GB" xml:lang="EN-GB" data-contrast="auto"><span class="NormalTextRun SCXW212166271 BCX4">Is it possible for policymakers to achieve environmentally sustainable economic growth? How can firms be encouraged to engage in research and development (R&amp;D) and innovation to solve the UK’s “productivity puzzle”? </span><span class="NormalTextRun SCXW212166271 BCX4">What’s</span><span class="NormalTextRun SCXW212166271 BCX4"> the best way to design an auction to maximise revenue? These are just a few of the complex questions this exciting MSc in Economics will equip you to tackle.</span></span><span class="EOP Selected SCXW212166271 BCX4" data-ccp-props="{&quot;201341983&quot;:0,&quot;335559738&quot;:240,&quot;335559739&quot;:240,&quot;335559740&quot;:276}">&nbsp;</span></p>
</div>
<div class="OutlineElement Ltr SCXW212166271 BCX4">
<p class="Paragraph SCXW212166271 BCX4"><span class="TextRun SCXW212166271 BCX4" lang="EN-GB" xml:lang="EN-GB" data-contrast="auto"><span class="NormalTextRun SCXW212166271 BCX4">You’ll</span><span class="NormalTextRun SCXW212166271 BCX4"> dive deep into core areas such as microeconomic and macroeconomic theory, as well as advanced econometrics—both theoretical and applied. But this course </span><span class="NormalTextRun SCXW212166271 BCX4">isn’t</span><span class="NormalTextRun SCXW212166271 BCX4"> one-size-fits-all. </span><span class="NormalTextRun SCXW212166271 BCX4">You’ll</span><span class="NormalTextRun SCXW212166271 BCX4"> have the freedom to shape your learning around your interests and career goals, selecting from a wide range of interesting optional modules aligned with the research strengths of the School of Economics: Finance, Environmental Economics and Data Science.&nbsp;</span></span><span class="EOP Selected SCXW212166271 BCX4" data-ccp-props="{&quot;201341983&quot;:0,&quot;335559738&quot;:240,&quot;335559739&quot;:240,&quot;335559740&quot;:276}">&nbsp;</span></p>
</div>
<div class="OutlineElement Ltr SCXW212166271 BCX4">
<p class="Paragraph SCXW212166271 BCX4"><span class="TextRun SCXW212166271 BCX4" lang="EN-GB" xml:lang="EN-GB" data-contrast="auto"><span class="NormalTextRun SCXW212166271 BCX4">Your dissertation is the capstone of this MSc</span><span class="NormalTextRun SCXW212166271 BCX4">. It gives you the</span><span class="NormalTextRun SCXW212166271 BCX4"> opportunity to apply your skills to a research topic of your choice, with expert guidance. You may also choose to collaborate with external organisations, gaining valuable work-based experience.</span></span><span class="EOP Selected SCXW212166271 BCX4" data-ccp-props="{&quot;201341983&quot;:0,&quot;335559738&quot;:240,&quot;335559739&quot;:240,&quot;335559740&quot;:276}">&nbsp;</span></p>
</div>
<div class="OutlineElement Ltr SCXW212166271 BCX4">
<p class="Paragraph SCXW212166271 BCX4"><span class="TextRun SCXW212166271 BCX4" lang="EN-GB" xml:lang="EN-GB" data-contrast="auto"><span class="NormalTextRun SCXW212166271 BCX4">Alongside first-class academic training, </span><span class="NormalTextRun SCXW212166271 BCX4">you’ll</span><span class="NormalTextRun SCXW212166271 BCX4"> enjoy access to a wide range of extracurricular and sporting opportunities at UEA, set in the vibrant and historic city of Norwich.</span></span><span class="EOP Selected SCXW212166271 BCX4" data-ccp-props="{&quot;335559739&quot;:160}">&nbsp;</span></p>
</div></div></section><div class="mb-4 sm:mb-6 md:mb-8"><div class="SB028_2_HorizontalCard__4k1e4 SB028_2_HorizontalCard--left__r4eME SB028_2_HorizontalCard__colour--bulrush-green__C85Mb SB028_2_HorizontalCard__image--stretch__5ccyD SB028_2_HorizontalCard__image--width-fifty__Ra19o SB028_2_HorizontalCard__padding--auto__NuqNa SB028_2_HorizontalCard__image--middle__uMafQ SB028_2 theme__www-v2" data-blok-c="{&quot;name&quot;:&quot;SB028_2&quot;,&quot;space&quot;:&quot;185167&quot;,&quot;uid&quot;:&quot;cafb9a7b-0a57-4276-be8b-daba8777939b&quot;,&quot;id&quot;:&quot;675266489&quot;}" data-blok-uid="675266489-cafb9a7b-0a57-4276-be8b-daba8777939b"><figure style="aspect-ratio:16/9"><img data-testid="image" class="_image_1wjha_15  _fill_1wjha_65 _loaded_1wjha_75  _mainimage_1wjha_59" src="./course-details_files/filters_quality(60)" alt="A group of economics students in discussion" srcset="https://www.uea.ac.uk/f/185167/3840x2160/95f4faed6d/economics-students_56346.jpg/m/294x0:3546x2160/384x0/filters:quality(60) 1x, https://www.uea.ac.uk/f/185167/3840x2160/95f4faed6d/economics-students_56346.jpg/m/294x0:3546x2160/576x0/filters:quality(60) 1.5x, https://www.uea.ac.uk/f/185167/3840x2160/95f4faed6d/economics-students_56346.jpg/m/294x0:3546x2160/768x0/filters:quality(60) 2x, https://www.uea.ac.uk/f/185167/3840x2160/95f4faed6d/economics-students_56346.jpg/m/294x0:3546x2160/1152x0/filters:quality(60) 3x" width="384" height="255" style="object-position: 50% 50%; background-image: url(&quot;https://www.uea.ac.uk/f/185167/3840x2160/95f4faed6d/economics-students_56346.jpg/m/294x0:3546x2160/128x0/filters:quality(10):blur(30)&quot;);"></figure><article><div class="richText"><h3>Economics at UEA</h3><p>Find out more about studying Economics at UEA, and browse our other courses.</p><a href="https://www.uea.ac.uk/study/subjects/economics" title="Find out more" class="SB027_2_Button__jgq_Y SB027_2_Button__secondary__tA8KM SB027_2_Button__auto__ffzOW" data-blok-c="{&quot;name&quot;:&quot;SB </div></div><h3 class="font-bold">Career Support</h3><div><div class="OutlineElement Ltr SCXW151956605 BCX4">
<p class="Paragraph SCXW151956605 BCX4"><span class="NormalTextRun SCXW151956605 BCX4">The School of Economics actively supports your career development through employer visits, skills training, and one-on-one guidance.&nbsp;</span><span class="EOP Selected SCXW151956605 BCX4" data-ccp-props="{&quot;201341983&quot;:0,&quot;335559739&quot;:160,&quot;335559740&quot;:276}">&nbsp;</span></p>
</div>
<div class="OutlineElement Ltr SCXW151956605 BCX4">
<p class="Paragraph SCXW151956605 BCX4"><span class="NormalTextRun SCXW151956605 BCX4">Our professional team at </span><a class="Hyperlink SCXW151956605 BCX4" href="https://www.uea.ac.uk/about/alumni-and-supporters/careers/about-our-services" target="_blank" rel="noreferrer noopener"><span class="NormalTextRun SCXW151956605 BCX4" data-ccp-charstyle="Hyperlink">Career Central</span><span class="sr-only">(opens in a new window)</span></a><span class="TextRun SCXW151956605 BCX4" lang="EN-US" xml:lang="EN-US" data-contrast="none"><span class="NormalTextRun SCXW151956605 BCX4"> will support you as you find your pa</span><span class="NormalTextRun SCXW151956605 BCX4">ssion or find ways to </span><span class="NormalTextRun SpellingErrorV2Themed SCXW151956605 BCX4">realise</span><span class="NormalTextRun SCXW151956605 BCX4"> your career ambitions. They offer mentoring, internships, </span><span class="NormalTextRun SCXW151956605 BCX4">career workshops,</span><span class="NormalTextRun SCXW151956605 BCX4"> and career events.</span></span><span class="EOP Selected SCXW151956605 BCX4" data-ccp-props="{&quot;201341983&quot;:0,&quot;335559739&quot;:160,&quot;335559740&quot;:276}">&nbsp;</span></p>
</div></div><h3 class="font-bold">After the Course</h3><div><div class="OutlineElement Ltr SCXW226099612 BCX4">
<p class="Paragraph SCXW226099612 BCX4"><span class="TextRun SCXW226099612 BCX4" lang="EN-US" xml:lang="EN-US" data-contrast="auto"><span class="NormalTextRun SCXW226099612 BCX4">Upon completing this MSc, you can pursue a variety of careers as a professional economist in government, industry, international </span><span class="NormalTextRun ContextualSpellingAndGrammarErrorV2Themed SCXW226099612 BCX4">agencies</span><span class="NormalTextRun SCXW226099612 BCX4"> and other similar </span><span class="NormalTextRun SCXW226099612 BCX4">organisations</span><span class="NormalTextRun SCXW226099612 BCX4">. Past graduates from the School of Economics have gone on to work for HM Treasury, the Home Office, Bank of England, Aviva, Barclays, M+A Partners, BDO, Deloitte, Ernst and Young, Goldman Sachs, Grant Thornton, HSBC, JP Morgan, KPMG, Lloyds, PwC and Santander, amongst others.</span></span><span class="EOP Selected SCXW226099612 BCX4" data-ccp-props="{&quot;335559738&quot;:240,&quot;335559739&quot;:240}">&nbsp;</span></p>
</div>
<div class="OutlineElement Ltr SCXW226099612 BCX4">
<p class="Paragraph SCXW226099612 BCX4"><span class="TextRun SCXW226099612 BCX4" lang="EN-US" xml:lang="EN-US" data-contrast="auto"><span class="NormalTextRun SCXW226099612 BCX4">You'll</span><span class="NormalTextRun SCXW226099612 BCX4"> also be </span><span class="NormalTextRun SCXW226099612 BCX4">well qualified</span><span class="NormalTextRun SCXW226099612 BCX4"> to enter a PhD </span><span class="NormalTextRun SpellingErrorV2Themed SCXW226099612 BCX4">programme</span><span class="NormalTextRun SCXW226099612 BCX4"> with a view to </span><span class="NormalTextRun SCXW226099612 BCX4">pursuing</span><span class="NormalTextRun SCXW226099612 BCX4"> an academic career. Many of our former PhD students now hold academic posts as lecturers </span><span class="NormalTextRun SCXW226099612 BCX4">or professors </span><span class="NormalTextRun SCXW226099612 BCX4">in university departments in the UK and overseas.</span></span><span class="EOP Selected SCXW226099612 BCX4" data-ccp-props="{&quot;134233117&quot;:false,&quot;134233118&quot;:false,&quot;201341983&quot;:0,&quot;335551550&quot;:1,&quot;335551620&quot;:1,&quot;335559685&quot;:0,&quot;335559737&quot;:0,&quot;335559738&quot;:240,&quot;335559739&quot;:240,&quot;335559740&quot;:240}">&nbsp;</span></p>
</div></div></section><section class="section-panel-white" id="course_modules" data-algolia-index="true"><div class="grid grid-cols-[auto_1fr] items-start gap-x-3"><svg viewBox="0 0 10 10" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" class="block w-7 sm:w-10 bg-bulrush-green"><path d="M4.373,9.015c0-3.54-.841-4.297-4.373-4.335v-.345C3.532,4.335,4.335,3.54,4.373,0h.337c0,3.54.833,4.297,4.365,4.328v.352c-3.532,0-4.327.795-4.365,4.335h-.337Z" transform="translate(.4625 0.4925)" clip-rule="evenodd" fill="#000000ff" stroke-linejoin="round" stroke-miterlimit="1.41421"></path></svg><div><h2 class="mb-1 text-2xl font-semibold sm:text-4xl">Study and Modules</h2><hr class="w-32 mb-6 bg-bulrush-green" style="height:2px"></div></div><div class="tabs_tabs__55dwW"><div id="tabContainer" class="tabs_tablist__nUjKp" role="tablist"><button type="button" role="tab" aria-selected="true" aria-controls="tab-0" id="tab0" class="tabs_tab__gi3un tabs_tab--active__3qO9n">Year 1</button><div class="tabs_tablist-base__uqX1a"></div></div><div><div role="tabpanel" id="tab-0" aria-labelledby="tab0" class="tabs_tab__gi3un tabs_tab-panel--active__r9oGC"><div><div><div><h3 class="mt-10 mb-1 text-2xl font-semibold">Structure</h3><div><div class="OutlineElement Ltr SCXW75390367 BCX4">
<p class="Paragraph SCXW75390367 BCX4"><span class="NormalTextRun SCXW75390367 BCX4">This MSc in Economics </span><span class="TextRun SCXW75390367 BCX4" lang="EN-GB" xml:lang="EN-GB" data-contrast="none"><span class="NormalTextRun SCXW75390367 BCX4">is a 12-month course, </span><span class="NormalTextRun SCXW75390367 BCX4">commencing</span><span class="NormalTextRun SCXW75390367 BCX4"> with the pre-sessional course in September.</span></span><span class="EOP Selected SCXW75390367 BCX4" data-ccp-props="{&quot;335559738&quot;:240,&quot;335559739&quot;:240}">&nbsp;</span></p>
</div>
<div class="OutlineElement Ltr SCXW75390367 BCX4">
<p class="Paragraph SCXW75390367 BCX4"><span class="TextRun SCXW75390367 BCX4" lang="EN-US" xml:lang="EN-US" data-contrast="auto"><span class="NormalTextRun SCXW75390367 BCX4">You’ll</span><span class="NormalTextRun SCXW75390367 BCX4"> receive rigorous training in core areas of economics, including microeconomics and econometric theory, followed by modules in macroeconomics and applied econometrics. </span><span class="NormalTextRun SCXW75390367 BCX4">You’ll</span><span class="NormalTextRun SCXW75390367 BCX4"> also </span><span class="NormalTextRun AdvancedProofingIssueV2Themed SCXW75390367 BCX4">have the opportunity to</span> <span class="NormalTextRun SCXW75390367 BCX4">customise</span> <span class="NormalTextRun ContextualSpellingAndGrammarErrorV2Themed SCXW75390367 BCX4">your</span><span class="NormalTextRun SCXW75390367 BCX4"> learning by selecting specialist modules that align with your interests and career goals.</span></span><span class="EOP Selected SCXW75390367 BCX4" data-ccp-props="{&quot;335559738&quot;:240,&quot;335559739&quot;:240}">&nbsp;</span></p>
</div>
<div class="OutlineElement Ltr SCXW75390367 BCX4">
<p class="Paragraph SCXW75390367 BCX4"><span class="TextRun SCXW75390367 BCX4" lang="EN-US" xml:lang="EN-US" data-contrast="auto"><span class="NormalTextRun SCXW75390367 BCX4">To prepare for your dissertation, </span><span class="NormalTextRun SCXW75390367 BCX4">you’ll</span><span class="NormalTextRun SCXW75390367 BCX4"> attend a series of training lectures covering how to choose a topic, access data, conduct literature reviews, and </span><span class="NormalTextRun SCXW75390367 BCX4">analyse</span><span class="NormalTextRun SCXW75390367 BCX4"> quantitative data. </span><span class="NormalTextRun SCXW75390367 BCX4">You’ll</span><span class="NormalTextRun SCXW75390367 BCX4"> also </span><span class="NormalTextRun SCXW75390367 BCX4">benefit</span><span class="NormalTextRun SCXW75390367 BCX4"> from </span><span class="NormalTextRun SCXW75390367 BCX4">additional</span><span class="NormalTextRun SCXW75390367 BCX4"> lab-based dissertation workshops.</span></span><span class="EOP Selected SCXW75390367 BCX4" data-ccp-props="{&quot;335559738&quot;:240,&quot;335559739&quot;:240}">&nbsp;</span></p>

ne shadow-none sm:p-4 undefined border-b-bulrush-green hover:outline-none "><h3 class="pr-2 mb-0 text-left">FINANCE</h3><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 shrink-0 rotate-180"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"></path></svg></button></div></div><div><div><h3 class="mt-10 mb-1 text-2xl font-semibold inline-block">Optional B Modules</h3> <span>(Credits: 20)</span></div><div class="w-full accordion_accordion__KxxrL"><button class="flex items-center justify-between w-full px-0 rounded-none shadow-none sm:p-4 undefined border-b-bulrush-green hover:outline-none "><h3 class="pr-2 mb-0 text-left">INTERNATIONAL FINANCE</h3><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 shrink-0 rotate-180"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"></path></svg></button></div><div class="w-full accordion_accordion__KxxrL"><button class="flex items-center justify-between w-full px-0 rounded-none shadow-none sm:p-4 undefined border-b-bulrush-green hover:outline-none "><h3 class="pr-2 mb-0 text-left">BEHAVIOURAL CONSUMER ANALYTICS</h3><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 shrink-0 rotate-180"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"></path></svg></button></div><div class="w-full accordion_accordion__KxxrL"><button class="flex items-center justify-between w-full px-0 rounded-none shadow-none sm:p-4 undefined border-b-bulrush-green hover:outline-none "><h3 class="pr-2 mb-0 text-left">ENVIRONMENTAL AND NATURAL RESOURCE ECONOMICS</h3><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 shrink-0 rotate-180"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"></path></svg></button></div><div class="w-full accordion_accordion__KxxrL"><button class="flex items-center justify-between w-full px-0 rounded-none shadow-none sm:p-4 undefined border-b-bulrush-green hover:outline-none "><h3 class="pr-2 mb-0 text-left">ECONOMIC APPLICATIONS OF DATA SCIENCE (EDS)</h3><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 shrink-0 rotate-180"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"></path></svg></button></div><div class="w-full accordion_accordion__KxxrL"><button class="flex items-center justify-between w-full px-0 rounded-none shadow-none sm:p-4 undefined border-b-bulrush-green hover:outline-none "><h3 class="pr-2 mb-0 text-left">FINANCIAL MATHEMATICS</h3><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 shrink-0 rotate-180"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"></path></svg></button></div></div></div><div class="my-10 text-sm"><strong>Important Information</strong><p>Whilst the University will make every effort to offer the modules listed, changes may sometimes be made arising from the annual monitoring, review and update of modules. Where this activity leads to significant (but not minor) changes to programmes and their constituent modules, the University will endeavour to consult with students and others. It is also possible that the University may not be able to offer a module for reasons outside of its control, such as the illness of a member of staff. In some cases optional modules can have limited places available and so you may be asked to make additional module choices in the event you do not gain a place on your first choice. Where this is the case, the University will inform students.</p></div></div></div></div></div></div></section><section class="mb-4 sm:mb-6 md:mb-8" id="teaching_learning" data-algolia-index="true"><div class="grid grid-cols-[auto_1fr] items-start gap-x-3"><svg viewBox="0 0 10 10" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" class="block w-7 sm:w-10 bg-bulrush-green"><path d="M4.373,9.015c0-3.54-.841-4.297-4.373-4.335v-.345C3.532,4.335,4.335,3.54,4.373,0h.337c0,3.54.833,4.297,4.365,4.328v.352c-3.532,0-4.327.795-4.365,4.335h-.337Z" transform="translate(.4625 0.4925)" clip-rule="evenodd" fill="#000000ff" stroke-linejoin="round" stroke-miterlimit="1.41421"></path></svg><div><h2 class="mb-1 text-2xl font-semibold sm:text-4xl">Teaching and Learning, and Assessment</h2><hr class="w-32 mb-6 bg-bulrush-green" style="height:2px"></div></div><div><div class="OutlineElement Ltr SCXW55059105 BCX4">
<p class="Paragraph SCXW55059105 BCX4"><strong><span class="NormalTextRun SCXW55059105 BCX4">Teaching and Learning</span><span class="EOP Selected SCXW55059105 BCX4" data-ccp-props="{&quot;335559739&quot;:160}">&nbsp;</span></strong></p>
</div>
<div class="OutlineElement Ltr SCXW55059105 BCX4">
<p class="Paragraph SCXW55059105 BCX4"><span class="TextRun SCXW55059105 BCX4" lang="EN-US" xml:lang="EN-US" data-contrast="auto"><span class="NormalTextRun SCXW55059105 BCX4">UEA’s School of Economics is a vibrant, friendly, research-focused community known for its excellence in teaching and innovation. With an international reputation across both theoretical and applied economics, </span><span class="NormalTextRun SCXW55059105 BCX4">we’re</span><span class="NormalTextRun SCXW55059105 BCX4"> home to world-leading </span><span class="NormalTextRun SCXW55059105 BCX4">expertise</span><span class="NormalTextRun SCXW55059105 BCX4"> in areas such as </span><span class="NormalTextRun SCXW55059105 BCX4">behavioural</span><span class="NormalTextRun SCXW55059105 BCX4"> economics, competition policy, environmental economics, corporate strategy, finance, and data science.</span></span><span class="EOP Selected SCXW55059105 BCX4" data-ccp-props="{&quot;335559738&quot;:240,&quot;335559739&quot;:240}">&nbsp;</span></p>
</div>
<div class="OutlineElement Ltr SCXW55059105 BCX4">
<p class="Paragraph SCXW55059105 BCX4"><span class="TextRun SCXW55059105 BCX4" lang="EN-GB" xml:lang="EN-GB" data-contrast="auto"><span class="NormalTextRun SCXW55059105 BCX4">From day one, </span><span class="NormalTextRun SCXW55059105 BCX4">you’ll</span><span class="NormalTextRun SCXW55059105 BCX4"> be set up for success with our intensive pre-sessional training, ensuring </span><span class="NormalTextRun SCXW55059105 BCX4">you’re</span><span class="NormalTextRun SCXW55059105 BCX4"> confident in core areas like calculus, matrix algebra, and the econometric software STATA.</span></span><span class="EOP Selected SCXW55059105 BCX4" data-ccp-props="{&quot;201341983&quot;:0,&quot;335559738&quot;:240,&quot;335559739&quot;:240,&quot;335559740&quot;:276}">&nbsp;</span></p>
</div>
<div class="OutlineElement Ltr SCXW55059105 BCX4">
<p class="Paragraph SCXW55059105 BCX4"><span class="NormalTextRun SCXW55059105 BCX4">Each of your modules will be taught across two semesters, blending lectures with seminars or lab sessions each week. While lectures introduce key concepts, seminars and labs are highly interactive, giving you the chance to explore ideas in more depth and ask questions.</span><span class="EOP SCXW55059105 BCX4" data-ccp-props="{&quot;335559738&quot;:240,&quot;335559739&quot;:240}">&nbsp;</span></p>
</div>
<div class="OutlineElement Ltr SCXW55059105 BCX4">
<p class="Paragraph SCXW55059105 BCX4"><span class="TextRun SCXW55059105 BCX4" lang="EN-US" xml:lang="EN-US" data-contrast="auto"><span class="NormalTextRun SCXW55059105 BCX4">In your econometrics modules, </span><span class="NormalTextRun SCXW55059105 BCX4">you’ll</span><span class="NormalTextRun SCXW55059105 BCX4"> gain hands-on experience with STATA, a specialist software package used widely by professional economists, equipping you with essential skills for data analysis and research</span><span class="NormalTextRun SCXW55059105 BCX4">.</span><span class="NormalTextRun SCXW55059105 BCX4">&nbsp; </span><span class="NormalTextRun SCXW55059105 BCX4">At the same </span><span class="NormalTextRun SCXW55059105 BCX4">time,</span> <span class="NormalTextRun SCXW55059105 BCX4">you’ll</span> </span><span class="TextRun SCXW55059105 BCX4" lang="EN-GB" xml:lang="EN-GB" data-contrast="auto"><span class="NormalTextRun SCXW55059105 BCX4">gain hands-on experience with </span><span class="NormalTextRun SCXW55059105 BCX4">cutting-edge</span><span class="NormalTextRun SCXW55059105 BCX4"> online data sources, empowering you to carry out impactful research.</span></span><span class="EOP Selected SCXW55059105 BCX4" data-ccp-props="{&quot;201341983&quot;:0,&quot;335559738&quot;:240,&quot;335559739&quot;:240,&quot;335559740&quot;:276}">&nbsp;</span></p>
</div>
<div class="OutlineElement Ltr SCXW55059105 BCX4">
<p class="Paragraph SCXW55059105 BCX4"><span class="TextRun SCXW55059105 BCX4" lang="EN-GB" xml:lang="EN-GB" data-contrast="auto"><span class="NormalTextRun SCXW55059105 BCX4">You'll</span><span class="NormalTextRun SCXW55059105 BCX4"> also become practised in independent study, spending time working on coursework assignments, preparing for seminars, and doing your own wider reading</span><span class="NormalTextRun SCXW55059105 BCX4">.</span><span class="NormalTextRun SCXW55059105 BCX4">&nbsp; </span><span class="NormalTextRun SCXW55059105 BCX4">These </span><span class="NormalTextRun SCXW55059105 BCX4">skills become particularly valuable when you come to work on your dissertation.</span></span><span class="EOP Selected SCXW55059105 BCX4" data-ccp-props="{&quot;201341983&quot;:0,&quot;335559738&quot;:240,&quot;335559739&quot;:240,&quot;335559740&quot;:276}">&nbsp;</span></p>
</div>
<div class="OutlineElement Ltr SCXW55059105 BCX4">
<p class="Paragraph SCXW55059105 BCX4"><strong><span class="NormalTextRun SCXW55059105 BCX4">Assessment</span><span class="EOP Selected SCXW55059105 BCX4" data-ccp-props="{&quot;335559739&quot;:160}">&nbsp;</span></strong></p>
</div>
<div class="OutlineElement Ltr SCXW55059105 BCX4">
<p class="Paragraph SCXW55059105 BCX4"><span class="TextRun SCXW55059105 BCX4" lang="EN-US" xml:lang="EN-US" data-contrast="auto"><span class="NormalTextRun SCXW55059105 BCX4">Your assessments will be in a variety of forms, including </span><span class="NormalTextRun SCXW55059105 BCX4">formal examinations, </span><span class="NormalTextRun SCXW55059105 BCX4">take-home assignments, seminar presentations, written tests, computer </span><span class="NormalTextRun SCXW55059105 BCX4">tests,</span><span class="NormalTextRun SCXW55059105 BCX4"> and your dissertation.</span></span><span class="EOP Selected SCXW55059105 BCX4" data-ccp-props="{&quot;335559738&quot;:240,&quot;335559739&quot;:240}">&nbsp;</span></p>
</div>
<div class="OutlineElement Ltr SCXW55059105 BCX4">
<p class="Paragraph SCXW55059105 BCX4"><span class="TextRun SCXW55059105 BCX4" lang="EN-US" xml:lang="EN-US" data-contrast="none"><span class="NormalTextRun SCXW55059105 BCX4">Some assessments require you to use AI technologies. In these tasks, </span><span class="NormalTextRun SCXW55059105 BCX4">you'll</span><span class="NormalTextRun SCXW55059105 BCX4"> learn to harness AI’s capabilities positively and constructively, with a strong emphasis on critically evaluating AI outputs.</span></span><span class="EOP Selected SCXW55059105 BCX4" data-ccp-props="{&quot;201341983&quot;:0,&quot;335559738&quot;:240,&quot;335559739&quot;:240,&quot;335559740&quot;:240}">&nbsp;</span></p>
</div>
<div class="OutlineElement Ltr SCXW55059105 BCX4">
<p class="Paragraph SCXW55059105 BCX4"><span class="TextRun SCXW55059105 BCX4" lang="EN-US" xml:lang="EN-US" data-contrast="auto"><span class="NormalTextRun SCXW55059105 BCX4">You’ll</span><span class="NormalTextRun SCXW55059105 BCX4"> regularly be given formative assessment tasks, providing opportunities to </span><span class="NormalTextRun SpellingErrorV2Themed SCXW55059105 BCX4">practise</span><span class="NormalTextRun SCXW55059105 BCX4"> assessment activities without affecting your module marks. When marked assessments are returned, </span><span class="NormalTextRun SCXW55059105 BCX4">you’ll</span><span class="NormalTextRun SCXW55059105 BCX4"> receive constructive written feedback to help you continue improving.</span></span><span class="EOP Selected SCXW55059105 BCX4" data-ccp-props="{&quot;335559738&quot;:240,&quot;335559739&quot;:240}">&nbsp;</span></p>
</div>
<div class="OutlineElement Ltr SCXW55059105 BCX4">
<p class="Paragraph SCXW55059105 BCX4"><span class="TextRun SCXW55059105 BCX4" lang="EN-US" xml:lang="EN-US" data-contrast="auto"><span class="NormalTextRun SCXW55059105 BCX4">If you have </span><span class="NormalTextRun SCXW55059105 BCX4">additional</span><span class="NormalTextRun SCXW55059105 BCX4"> needs due to disabilities such as sensory impairment, or learning difficulties such as dyslexia, you can obtain help from our </span></span><a class="Hyperlink SCXW55059105 BCX4" href="https://www.uea.ac.uk/uea-life/student-support" target="_blank" rel="noreferrer noopener"><span class="NormalTextRun SCXW55059105 BCX4" data-ccp-charstyle="Hyperlink">Student Support</span><span class="sr-only">(opens in a new window)</span></a><span class="NormalTextRun SCXW55059105 BCX4"> services.</span><span class="EOP Selected SCXW55059105 BCX4" data-ccp-props="{&quot;335559739&quot;:160}">&nbsp;</span></p>
</div></div></section></div><div><section id="entry_requirements" class="section-panel-white" data-algolia-index="true"><div class="grid grid-cols-[auto_1fr] items-start gap-x-3"><svg viewBox="0 0 10 10" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" class="block w-7 sm:w-10 bg-bulrush-green"><path d="M4.373,9.015c0-3.54-.841-4.297-4.373-4.335v-.345C3.532,4.335,4.335,3.54,4.373,0h.337c0,3.54.833,4.297,4.365,4.328v.352c-3.532,0-4.327.795-4.365,4.335h-.337Z" transform="translate(.4625 0.4925)" clip-rule="evenodd" fill="#000000ff" stroke-linejoin="round" stroke-miterlimit="1.41421"></path></svg><div><h2 class="mb-1 text-2xl font-semibold sm:text-4xl">Entry Requirements</h2><hr class="w-32 mb-6 bg-bulrush-green" style="height:2px"></div></div><div class="tabs_tabs__55dwW"><div id="tabContainer" class="tabs_tablist__nUjKp" role="tablist"><button type="button" role="tab" aria-selected="true" aria-controls="tab-0" id="tab0" class="tabs_tab__gi3un tabs_tab--active__3qO9n">UK</button><button type="button" role="tab" aria-selected="false" aria-controls="tab-1" id="tab1" class="tab">International</button><div class="tabs_tablist-base__uqX1a"></div></div><div><div role="tabpanel" id="tab-0" aria-labelledby="tab0" class="tabs_tab__gi3un tabs_tab-panel--active__r9oGC"><div><dl><div><dt class="font-semibold">This course is open to</dt><dd><div class="OutlineElement Ltr SCXW263323043 BCX0">
<p class="Paragraph SCXW263323043 BCX0"><span class="TextRun SCXW263323043 BCX0" lang="EN-GB" xml:lang="EN-GB" data-contrast="auto"><span class="NormalTextRun SCXW263323043 BCX0" data-ccp-charstyle="eop" data-ccp-charstyle-defn="{&quot;ObjectId&quot;:&quot;79474d22-7bb9-48b5-9eea-fd44c418c667|235&quot;,&quot;ClassId&quot;:1073872969,&quot;Properties&quot;:[469775450,&quot;eop&quot;,201340122,&quot;1&quot;,134233614,&quot;true&quot;,469778129,&quot;eop&quot;,335572020,&quot;1&quot;,469778324,&quot;Default Paragraph Font&quot;]}">UK and International fee-paying students. Choose UK or International above to see relevant information. The entry point is in September each year.</span></span></p>
</div>
<div class="OutlineElement Ltr SCXW263323043 BCX0">
<p class="Paragraph SCXW263323043 BCX0">&nbsp;</p>
</div></dd></div><div><dt class="font-semibold">Typical UK Entry Requirements</dt><dd><h3>Degree classification</h3>
<p>Bachelors degree - 2.2</p>
<h3>Degree Subject</h3>
<p>Economics</p></dd></div><div><dt class="font-semibold">Admissions Policy</dt><dd><p>Our&nbsp;<a href="https://www.uea.ac.uk/apply/our-admissions-policy">Admissions Policy</a> applies to the admissions of all postgraduate applicants.</p></dd></div></dl></div></div><div role="tabpanel" id="tab-1" aria-labelledby="tab1" class="tabs_tab-panel__5vOnM"><div><dl><div><dt class="font-semibold">This course is open to</dt><dd><div class="OutlineElement Ltr SCXW263323043 BCX0">
<p class="Paragraph SCXW263323043 BCX0"><span class="TextRun SCXW263323043 BCX0" lang="EN-GB" xml:lang="EN-GB" data-contrast="auto"><span class="NormalTextRun SCXW263323043 BCX0" data-ccp-charstyle="eop" data-ccp-charstyle-defn="{&quot;ObjectId&quot;:&quot;79474d22-7bb9-48b5-9eea-fd44c418c667|235&quot;,&quot;ClassId&quot;:1073872969,&quot;Properties&quot;:[469775450,&quot;eop&quot;,201340122,&quot;1&quot;,134233614,&quot;true&quot;,469778129,&quot;eop&quot;,335572020,&quot;1&quot;,469778324,&quot;Default Paragraph Font&quot;]}">UK and International fee-paying students. Choose UK or International above to see relevant information. The entry point is in September each year.</span></span></p>
</div>
<div class="OutlineElement Ltr SCXW263323043 BCX0">
<p class="Paragraph SCXW263323043 BCX0">&nbsp;</p>
</div></dd></div><div><dt class="font-semibold">Typical International  Entry Requirements</dt><dd><h3>Degree classification</h3>
<p>UK Bachelors degree - 2.2 or equivalent&nbsp;</p>
<h3>Degree Subject</h3>
<p>Economics</p></dd></div><div><dt class="font-semibold">English Foreign Language</dt><dd><p>Applications from students whose first language is not English are welcome. We require evidence of proficiency in English (including writing, speaking, listening and reading): &nbsp;&nbsp;</p>
<ul role="list">
<li role="listitem" aria-setsize="-1" data-aria-level="1" data-aria-posinset="1" data-font="Symbol" data-leveltext="" data-list-defn-props="{&quot;335552541&quot;:1,&quot;335559684&quot;:-2,&quot;335559685&quot;:720,&quot;335559991&quot;:360,&quot;469769226&quot;:&quot;Symbol&quot;,&quot;469769242&quot;:[8226],&quot;469777803&quot;:&quot;left&quot;,&quot;469777804&quot;:&quot;&quot;,&quot;469777815&quot;:&quot;hybridMultilevel&quot;}" data-listid="3">
<p>IELTS: 6.0 overall (minimum 5.5 in each component).</p>
</li>
</ul>
<p>We also accept a number of other English language tests. Review our&nbsp;<a href="https://www.uea.ac.uk/apply/our-admissions-policy/english-language-equivalencies" target="_blank" rel="noopener">English Language Equivalencies<span class="sr-only">(opens in a new window)</span></a> for a list of example qualifications that we may accept to meet this requirement.&nbsp;</p>
<p>Test dates should be within two years of the course start date.&nbsp;</p>
<p>If you do not meet the English language requirements for this course, our&nbsp;<a href="https://ueaisc.com/en">UEA International Study Centre</a> offers a variety of English language programmes which are designed to help you develop the required English skills.&nbsp;</p>

<ul role="list">
<li role="listitem" aria-setsize="-1" data-aria-level="1" data-aria-posinset="1" data-font="Symbol" data-leveltext="" data-listid="1">

<div class="relative">
<p>Applications for Postgraduate Taught programmes at the University of East Anglia should be made directly to the University.&nbsp;</p>
<p>To apply please use our <a href="http://www.uea.ac.uk/study/postgraduate/apply?_ga=2.44277991.250531214.1569830540-260057648.1551342620" target="_blank" rel="noreferrer noopener">online application form<span class="sr-only">(opens in a new window)</span></a>.&nbsp;</p>
<h3><strong>Further information</strong></h3>
<p>If you would like to discuss your individual circumstances prior to applying, please do contact us:&nbsp;</p>
<p>Postgraduate Admissions Office&nbsp;</p>
<p>Tel: +44 (0)1603 591515&nbsp;<br>Email: <a href="mailto:admissions@uea.ac.uk" target="_blank" rel="noreferrer noopener">admissions@uea.ac.uk<span class="sr-only">(opens in a new window)</span></a>&nbsp;</p>
<p>International candidates are also encouraged to access the <a href="http://www.uea.ac.uk/international" target="_blank" rel="noreferrer noopener">International Students<span class="sr-only">(opens in a new window)</span></a> section of our website.&nbsp;</p>

onomics-and-international-relations/2027-28/sep">Find out more<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 ml-2"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"></path></svg></a></div></div></div></div></div><div data-index="1" class="slick-slide slick-active" tabindex="-1" aria-hidden="false" style="outline: none; width: 427px;"><div><div class="px-2" tabindex="-1" style="width:100%;display:inline-block"><div class="flex flex-col justify-between w-full h-full p-6 bg-brutalist-grey-40"><div><p class="mb-1 text-sm">2027/28 Entry</p><h4 class="mb-4 text-2xl font-bold break-words">MSc Finance and Economics</h4><p class="mb-4 overflow-hidden text-gray-600" style="display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5">This course is part of our Academic and Professional Programme. It’s designed for people who have already studied economics and are looking for intensive research-led training in advanced economic theory and econometrics, with a focus on finance.</p></div><div class="mt-auto"><a aria-label="Find out more about Finance and Economics" class="inline-flex items-center font-semibold underline hover:no-underline" href="https://www.uea.ac.uk/course/postgraduate/msc-finance-and-economics/2027-28/sep">Find out more<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 ml-2"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"></path></svg></a></div></div></div></div></div><div data-index="2" class="slick-slide slick-active" tabindex="-1" aria-hidden="false" style="outline: none; width: 427px;"><div><div class="px-2" tabindex="-1" style="width:100%;display:inline-block"><div class="flex flex-col justify-between w-full h-full p-6 bg-brutalist-grey-40"><div><p class="mb-1 text-sm">2027/28 Entry</p><h4 class="mb-4 text-2xl font-bold break-wor CX4\"\u003e\n\u003cp class=\"Paragraph SCXW212166271 BCX4\"\u003e\u003cstrong\u003e\u003cspan class=\"TextRun SCXW212166271 BCX4\" lang=\"EN-US\" xml:lang=\"EN-US\" data-contrast=\"none\"\u003e\u003cspan class=\"NormalTextRun SCXW212166271 BCX4\"\u003eWhy\u003c/span\u003e \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW212166271 BCX4\"\u003eMSc Economics\u003c/span\u003e \u003cspan class=\"NormalTextRun SCXW212166271 BCX4\"\u003eat UEA?\u003c/span\u003e\u003cspan class=\"EOP Selected SCXW212166271 BCX4\" data-ccp-props=\"{\u0026quot;335559738\u0026quot;:240,\u0026quot;335559739\u0026quot;:240}\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"OutlineElement Ltr SCXW212166271 BCX4\"\u003e\n\u003cp class=\"Paragraph SCXW212166271 BCX4\"\u003e\u003cspan class=\"TextRun SCXW212166271 BCX4\" lang=\"EN-GB\" xml:lang=\"EN-GB\" data-contrast=\"auto\"\u003e\u003cspan class=\"NormalTextRun SCXW212166271 BCX4\"\u003eA\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW212166271 BCX4\"\u003elready studied economics and looking for intensive research-led training in advanced economic theory\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW212166271 BCX4\"\u003e? Try this rewarding course, which is\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW212166271 BCX4\"\u003e part of our Academic and Professional Programme\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW212166271 BCX4\"\u003e.\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"EOP Selected SCXW212166271 BCX4\" data-ccp-props=\"{\u0026quot;134233117\u0026quot;:false,\u0026quot;134233118\u0026quot;:false,\u0026quot;201341983\u0026quot;:0,\u0026quot;335551550\u0026quot;:1,\u0026quot;335551620\u0026quot;:1,\u0026quot;335559685\u0026quot;:0,\u0026quot;335559737\u0026quot;:0,\u0026quot;335559738\u0026quot;:240,\u0026quot;335559739\u0026quot;:240,\u0026quot;335559740\u0026quot;:276}\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"ListContainerWrapper SCXW212166271 BCX4\"\u003e\n\u003cdiv class=\"impact-bullets colour-green\"\u003e\n\u003ch3 class=\"impact-bullets-title\"\u003eWhy Choose UEA\u003c/h3\u003e\n\u003cul class=\"impact-bullets-list\"\u003e\n\u003cli\u003e\u003cstrong\u003eCore Economics Training\u003c/strong\u003e: Gain a thorough grounding in both Economic Theory and Econometrics, as a solid preparation for a career as a professional economist\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLearn from professionals\u003c/strong\u003e: Benefit from teaching by leading researchers in economic theory and econometrics\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAI for positive impact\u003c/strong\u003e: Learn how to harness AI\u0026rsquo;s capabilities in positive, constructive ways in the advanced study of Economics\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\u003cdiv class=\"OutlineElement Ltr SCXW212166271 BCX4\"\u003e\n\u003cp class=\"Paragraph SCXW212166271 BCX4\"\u003e\u003cstrong\u003e\u003cspan class=\"TextRun SCXW212166271 BCX4\" lang=\"EN-US\" xml:lang=\"EN-US\" data-contrast=\"none\"\u003e\u003cspan class=\"NormalTextRun SCXW212166271 BCX4\"\u003eWhat\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW212166271 BCX4\"\u003e is \u003c/span\u003e\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW212166271 BCX4\"\u003eMSc Economics\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW212166271 BCX4\"\u003e?\u003c/span\u003e\u003cspan class=\"EOP Selected SCXW212166271 BCX4\" data-ccp-props=\"{\u0026quot;335559739\u0026quot;:160}\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"OutlineElement Ltr SCXW212166271 BCX4\"\u003e\n\u003cp class=\"Paragraph SCXW212166271 BCX4\"\u003e\u003cspan class=\"TextRun SCXW212166271 BCX4\" lang=\"EN-GB\" xml:lang=\"EN-GB\" data-contrast=\"auto\"\u003e\u003cspan class=\"NormalTextRun SCXW212166271 BCX4\"\u003eIs it possible for policymakers to achieve environmentally sustainable economic growth? How can firms be encouraged to engage in research and development (R\u0026amp;D) and innovation to solve the UK\u0026rsquo;s \u0026ldquo;productivity puzzle\u0026rdquo;? \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW212166271 BCX4\"\u003eWhat\u0026rsquo;s\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW212166271 BCX4\"\u003e the best way to design an auction to maximise revenue? These are just a few of the complex questions this exciting MSc in Economics will equip you to tackle.\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"EOP Selected SCXW212166271 BCX4\" data-ccp-props=\"{\u0026quot;201341983\u0026quot;:0,\u0026quot;335559738\u0026quot;:240,\u0026quot;335559739\u0026quot;:240,\u0026quot;335559740\u0026quot;:276}\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"OutlineElement Ltr SCXW212166271 BCX4\"\u003e\n\u003cp class=\"Paragraph SCXW212166271 BCX4\"\u003e\u003cspan class=\"TextRun SCXW212166271 BCX4\" lang=\"EN-GB\" xml:lang=\"EN-GB\" data-contrast=\"auto\"\u003e\u003cspan class=\"NormalTextRun SCXW212166271 BCX4\"\u003eYou\u0026rsquo;ll\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW212166271 BCX4\"\u003e dive deep into core areas such as microeconomic and macroeconomic theory, as well as advanced econometrics\u0026mdash;both theoretical and applied. But this course \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW212166271 BCX4\"\u003eisn\u0026rsquo;t\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW212166271 BCX4\"\u003e one-size-fits-all. \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW212166271 BCX4\"\u003eYou\u0026rsquo;ll\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW212166271 BCX4\"\u003e have the freedom to shape your learning around your interests and career goals, selecting from a wide range of interesting optional modules aligned with the research strengths of the School of Economics: Finance, Environmental Economics and Data Science.\u0026nbsp;\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"EOP Selected SCXW212166271 BCX4\" data-ccp-props=\"{\u0026quot;201341983\u0026quot;:0,\u0026quot;335559738\u0026quot;:240,\u0026quot;335559739\u0026quot;:240,\u0026quot;335559740\u0026quot;:276}\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"OutlineElement Ltr SCXW212166271 BCX4\"\u003e\n\u003cp class=\"Paragraph SCXW212166271 BCX4\"\u003e\u003cspan class=\"TextRun SCXW212166271 BCX4\" lang=\"EN-GB\" xml:lang=\"EN-GB\" data-contrast=\"auto\"\u003e\u003cspan class=\"NormalTextRun SCXW212166271 BCX4\"\u003eYour dissertation is the capstone of this MSc\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW212166271 BCX4\"\u003e. It gives you the\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW212166271 BCX4\"\u003e opportunity to apply your skills to a research topic of your choice, with expert guidance. You may also choose to collaborate with external organisations, gaining valuable work-based experience.\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"EOP Selected SCXW212166271 BCX4\" data-ccp-props=\"{\u0026quot;201341983\u0026quot;:0,\u0026quot;335559738\u0026quot;:240,\u0026quot;335559739\u0026quot;:240,\u0026quot;335559740\u0026quot;:276}\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"OutlineElement Ltr SCXW212166271 BCX4\"\u003e\n\u003cp class=\"Paragraph SCXW212166271 BCX4\"\u003e\u003cspan class=\"TextRun SCXW212166271 BCX4\" lang=\"EN-GB\" xml:lang=\"EN-GB\" data-contrast=\"auto\"\u003e\u003cspan class=\"NormalTextRun SCXW212166271 BCX4\"\u003eAlongside first-class academic training, \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW212166271 BCX4\"\u003eyou\u0026rsquo;ll\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW212166271 BCX4\"\u003e enjoy access to a wide range of extracurricular and sporting opportunities at UEA, set in the vibrant and historic city of Norwich. 3eThe School of Economics actively supports your career development through employer visits, skills training, and one-on-one guidance.\u0026nbsp;\u003c/span\u003e\u003cspan class=\"EOP Selected SCXW151956605 BCX4\" data-ccp-props=\"{\u0026quot;201341983\u0026quot;:0,\u0026quot;335559739\u0026quot;:160,\u0026quot;335559740\u0026quot;:276}\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"OutlineElement Ltr SCXW151956605 BCX4\"\u003e\n\u003cp class=\"Paragraph SCXW151956605 BCX4\"\u003e\u003cspan class=\"NormalTextRun SCXW151956605 BCX4\"\u003eOur professional team at \u003c/span\u003e\u003ca class=\"Hyperlink SCXW151956605 BCX4\" href=\"https://www.uea.ac.uk/about/alumni-and-supporters/careers/about-our-services\" target=\"_blank\" rel=\"noreferrer noopener\"\u003e\u003cspan class=\"NormalTextRun SCXW151956605 BCX4\" data-ccp-charstyle=\"Hyperlink\"\u003eCareer Central\u003c/span\u003e\u003c/a\u003e\u003cspan class=\"TextRun SCXW151956605 BCX4\" lang=\"EN-US\" xml:lang=\"EN-US\" data-contrast=\"none\"\u003e\u003cspan class=\"NormalTextRun SCXW151956605 BCX4\"\u003e will support you as you find your pa\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW151956605 BCX4\"\u003ession or find ways to \u003c/span\u003e\u003cspan class=\"NormalTextRun SpellingErrorV2Themed SCXW151956605 BCX4\"\u003erealise\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW151956605 BCX4\"\u003e your career ambitions. They offer mentoring, internships, \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW151956605 BCX4\"\u003ecareer workshops,\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW151956605 BCX4\"\u003e and career events.\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"EOP Selected SCXW151956605 BCX4\" data-ccp-props=\"{\u0026quot;201341983\u0026quot;:0,\u0026quot;335559739\u0026quot;:160,\u0026quot;335559740\u0026quot;:276}\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e","cma_after_course":"\u003cdiv class=\"OutlineElement Ltr SCXW226099612 BCX4\"\u003e\n\u003cp class=\"Paragraph SCXW226099612 BCX4\"\u003e\u003cspan class=\"TextRun SCXW226099612 BCX4\" lang=\"EN-US\" xml:lang=\"EN-US\" data-contrast=\"auto\"\u003e\u003cspan class=\"NormalTextRun SCXW226099612 BCX4\"\u003eUpon completing this MSc, you can pursue a variety of careers as a professional economist in government, industry, international \u003c/span\u003e\u003cspan class=\"NormalTextRun ContextualSpellingAndGrammarErrorV2Themed SCXW226099612 BCX4\"\u003eagencies\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW226099612 BCX4\"\u003e and other similar \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW226099612 BCX4\"\u003eorganisations\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW226099612 BCX4\"\u003e. Past graduates from the School of Economics have gone on to work for HM Treasury, the Home Office, Bank of England, Aviva, Barclays, M+A Partners, BDO, Deloitte, Ernst and Young, Goldman Sachs, Grant Thornton, HSBC, JP Morgan, KPMG, Lloyds, PwC and Santander, amongst others.\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"EOP Selected SCXW226099612 BCX4\" data-ccp-props=\"{\u0026quot;335559738\u0026quot;:240,\u0026quot;335559739\u0026quot;:240}\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"OutlineElement Ltr SCXW226099612 BCX4\"\u003e\n\u003cp class=\"Paragraph SCXW226099612 BCX4\"\u003e\u003cspan class=\"TextRun SCXW226099612 BCX4\" lang=\"EN-US\" xml:lang=\"EN-US\" data-contrast=\"auto\"\u003e\u003cspan class=\"NormalTextRun SCXW226099612 BCX4\"\u003eYou'll\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW226099612 BCX4\"\u003e also be \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW226099612 BCX4\"\u003ewell qualified\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW226099612 BCX4\"\u003e to enter a PhD \u003c/span\u003e\u003cspan class=\"NormalTextRun SpellingErrorV2Themed SCXW226099612 BCX4\"\u003eprogramme\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW226099612 BCX4\"\u003e with a view to \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW226099612 BCX4\"\u003epursuing\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW226099612 BCX4\"\u003e an academic career. Many of our former PhD students now hold academic posts as lecturers \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW226099612 BCX4\"\u003eor professors \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW226099612 BCX4\"\u003ein university departments in the UK and overseas.\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"EOP Selected SCXW226099612 BCX4\" data-ccp-props=\"{\u0026quot;134233117\u0026quot;:false,\u0026quot;134233118\u0026quot;:false,\u0026quot;201341983\u0026quot;:0,\u0026quot;335551550\u0026quot;:1,\u0026quot;335551620\u0026quot;:1,\u0026quot;335559685\u0026quot;:0,\u0026quot;335559737\u0026quot;:0,\u0026quot;335559738\u0026quot;:240,\u0026quot;335559739\u0026quot;:240,\u0026quot;335559740\u0026quot;:240}\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e","cma_teaching_learning_assessment":"\u003cdiv class=\"OutlineElement Ltr SCXW55059105 BCX4\"\u003e\n\u003cp class=\"Paragraph SCXW55059105 BCX4\"\u003e\u003cstrong\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003eTeaching and Learning\u003c/span\u003e\u003cspan class=\"EOP Selected SCXW55059105 BCX4\" data-ccp-props=\"{\u0026quot;335559739\u0026quot;:160}\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"OutlineElement Ltr SCXW55059105 BCX4\"\u003e\n\u003cp class=\"Paragraph SCXW55059105 BCX4\"\u003e\u003cspan class=\"TextRun SCXW55059105 BCX4\" lang=\"EN-US\" xml:lang=\"EN-US\" data-contrast=\"auto\"\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003eUEA\u0026rsquo;s School of Economics is a vibrant, friendly, research-focused community known for its excellence in teaching and innovation. With an international reputation across both theoretical and applied economics, \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003ewe\u0026rsquo;re\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003e home to world-leading \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003eexpertise\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003e in areas such as \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003ebehavioural\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003e economics, competition policy, environmental economics, corporate strategy, finance, and data science.\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"EOP Selected SCXW55059105 BCX4\" data-ccp-props=\"{\u0026quot;335559738\u0026quot;:240,\u0026quot;335559739\u0026quot;:240}\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"OutlineElement Ltr SCXW55059105 BCX4\"\u003e\n\u003cp class=\"Paragraph SCXW55059105 BCX4\"\u003e\u003cspan class=\"TextRun SCXW55059105 BCX4\" lang=\"EN-GB\" xml:lang=\"EN-GB\" data-contrast=\"auto\"\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003eFrom day one, \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003eyou\u0026rsquo;ll\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003e be set up for success with our intensive pre-sessional training, ensuring \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003eyou\u0026rsquo;re\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003e confident in core areas like calculus, matrix algebra, and the econometric software STATA.\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"EOP Selected SCXW55059105 BCX4\" data-ccp-props=\"{\u0026quot;201341983\u0026quot;:0,\u0026quot;335559738\u0026quot;:240,\u0026quot;335559739\u0026quot;:240,\u0026quot;335559740\u0026quot;:276}\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"OutlineElement Ltr SCXW55059105 BCX4\"\u003e\n\u003cp class=\"Paragraph SCXW55059105 BCX4\"\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003eEach of your modules will be taught across two semesters, blending lectures with seminars or lab sessions each week. While lectures introduce key concepts, seminars and labs are highly interactive, giving you the chance to explore ideas in more depth and ask questions.\u003c/span\u003e\u003cspan class=\"EOP SCXW55059105 BCX4\" data-ccp-props=\"{\u0026quot;335559738\u0026quot;:240,\u0026quot;335559739\u0026quot;:240}\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"OutlineElement Ltr SCXW55059105 BCX4\"\u003e\n\u003cp class=\"Paragraph SCXW55059105 BCX4\"\u003e\u003cspan class=\"TextRun SCXW55059105 BCX4\" lang=\"EN-US\" xml:lang=\"EN-US\" data-contrast=\"auto\"\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003eIn your econometrics modules, \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003eyou\u0026rsquo;ll\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003e gain hands-on experience with STATA, a specialist software package used widely by professional economists, equipping you with essential skills for data analysis and research\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003e.\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003e\u0026nbsp; \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003eAt the same \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003etime,\u003c/span\u003e \u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003eyou\u0026rsquo;ll\u003c/span\u003e \u003c/span\u003e\u003cspan class=\"TextRun SCXW55059105 BCX4\" lang=\"EN-GB\" xml:lang=\"EN-GB\" data-contrast=\"auto\"\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003egain hands-on experience with \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003ecutting-edge\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003e online data sources, empowering you to carry out impactful research.\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"EOP Selected SCXW55059105 BCX4\" data-ccp-props=\"{\u0026quot;201341983\u0026quot;:0,\u0026quot;335559738\u0026quot;:240,\u0026quot;335559739\u0026quot;:240,\u0026quot;335559740\u0026quot;:276}\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"OutlineElement Ltr SCXW55059105 BCX4\"\u003e\n\u003cp class=\"Paragraph SCXW55059105 BCX4\"\u003e\u003cspan class=\"TextRun SCXW55059105 BCX4\" lang=\"EN-GB\" xml:lang=\"EN-GB\" data-contrast=\"auto\"\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003eYou'll\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003e also become practised in independent study, spending time working on coursework assignments, preparing for seminars, and doing your own wider reading\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003e.\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003e\u0026nbsp; \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003eThese \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003eskills become particularly valuable when you come to work on your dissertation.\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"EOP Selected SCXW55059105 BCX4\" data-ccp-props=\"{\u0026quot;201341983\u0026quot;:0,\u0026quot;335559738\u0026quot;:240,\u0026quot;335559739\u0026quot;:240,\u0026quot;335559740\u0026quot;:276}\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"OutlineElement Ltr SCXW55059105 BCX4\"\u003e\n\u003cp class=\"Paragraph SCXW55059105 BCX4\"\u003e\u003cstrong\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003eAssessment\u003c/span\u003e\u003cspan class=\"EOP Selected SCXW55059105 BCX4\" data-ccp-props=\"{\u0026quot;335559739\u0026quot;:160}\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"OutlineElement Ltr SCXW55059105 BCX4\"\u003e\n\u003cp class=\"Paragraph SCXW55059105 BCX4\"\u003e\u003cspan class=\"TextRun SCXW55059105 BCX4\" lang=\"EN-US\" xml:lang=\"EN-US\" data-contrast=\"auto\"\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003eYour assessments will be in a variety of forms, including \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003eformal examinations, \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003etake-home assignments, seminar presentations, written tests, computer \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003etests,\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003e and your dissertation.\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"EOP Selected SCXW55059105 BCX4\" data-ccp-props=\"{\u0026quot;335559738\u0026quot;:240,\u0026quot;335559739\u0026quot;:240}\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"OutlineElement Ltr SCXW55059105 BCX4\"\u003e\n\u003cp class=\"Paragraph SCXW55059105 BCX4\"\u003e\u003cspan class=\"TextRun SCXW55059105 BCX4\" lang=\"EN-US\" xml:lang=\"EN-US\" data-contrast=\"none\"\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003eSome assessments require you to use AI technologies. In these tasks, \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003eyou'll\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003e learn to harness AI\u0026rsquo;s capabilities positively and constructively, with a strong emphasis on critically evaluating AI outputs.\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"EOP Selected SCXW55059105 BCX4\" data-ccp-props=\"{\u0026quot;201341983\u0026quot;:0,\u0026quot;335559738\u0026quot;:240,\u0026quot;335559739\u0026quot;:240,\u0026quot;335559740\u0026quot;:240}\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"OutlineElement Ltr SCXW55059105 BCX4\"\u003e\n\u003cp class=\"Paragraph SCXW55059105 BCX4\"\u003e\u003cspan class=\"TextRun SCXW55059105 BCX4\" lang=\"EN-US\" xml:lang=\"EN-US\" data-contrast=\"auto\"\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003eYou\u0026rsquo;ll\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003e regularly be given formative assessment tasks, providing opportunities to \u003c/span\u003e\u003cspan class=\"NormalTextRun SpellingErrorV2Themed SCXW55059105 BCX4\"\u003epractise\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003e assessment activities without affecting your module marks. When marked assessments are returned, \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003eyou\u0026rsquo;ll\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003e receive constructive written feedback to help you continue improving.\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"EOP Selected SCXW55059105 BCX4\" data-ccp-props=\"{\u0026quot;335559738\u0026quot;:240,\u0026quot;335559739\u0026quot;:240}\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"OutlineElement Ltr SCXW55059105 BCX4\"\u003e\n\u003cp class=\"Paragraph SCXW55059105 BCX4\"\u003e\u003cspan class=\"TextRun SCXW55059105 BCX4\" lang=\"EN-US\" xml:lang=\"EN-US\" data-contrast=\"auto\"\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003eIf you have \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003eadditional\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW55059105 BCX4\"\u003e needs due to disabilities such as sensory impairment, or learning difficulties such as dyslexia, you can obtain help from our \u003c/span\u003e\u003c/span\u003e\u003ca class=\"Hyperlink SCXW55059105 BCX4
