27/sep","title":"Economics","start_date":"2026-09-25 00:00:00","dates":[],"awardType":{"code":"MSc"},"courseType":{"url_fragment":"postgraduate"}},{"published":true,"id":"57f16c90-bc69-4994-906d-777a60c56d55","url":"msc-economics/2027-28/sep","title":"Economics","start_date":"2027-09-25 00:00:00","dates":[],"awardType":{"code":"MSc"},"courseType":{"url_fragment":"postgraduate"}}]},"related":[{"title":"Economics and International Relations","title_prefix":null,"title_suffix":null,"academic_year":"2027/28","awardType":{"code":"MSc"},"meta":{"summary":"This interdisciplinary programme equips you with the analytical tools and insight to understand and influence world economic and political forces. This MSc is designed for those eager to develop essential economic skills and apply them to real-world issues in international relations."},"url":"msc-economics-and-international-relations/2027-28/sep","courseType":{"url_fragment":"postgraduate"}},{"title":"Finance and Economics","title_prefix":null,"title_suffix":null,"academic_year":"2027/28","awardType":{"code":"MSc"},"meta":{"summary":"This course is part of our Academic and Professional Programme. It’s designed for people who have already studied economics and are looking for intensive research-led training in advanced economic theory and econometrics, with a focus on finance."},"url":"msc-finance-and-economics/2027-28/sep","courseType":{"url_fragment":"postgraduate"}},{"title":"International Business Economics","title_prefix":null,"title_suffix":null,"academic_year":"2027/28","awardType":{"code":"MSc"},"meta":{"summary":"If you haven’t completed a degree in economics but would like to develop skills in economics, this course is for you. This MSc has a particular focus on international economics and trade."},"url":"msc-international-business-economics/2027-28/sep","courseType":{"url_fragment":"postgraduate"}},{"title":"Economics and Data Science","title_prefix":null,"title_suffix":null,"academic_year":"2027/28","awardType":{"code":"MSc"},"meta":{"summary":"This course is part of our Academic and Professional Programme. It’s designed for those who have already studied economics and are looking for intensive research-led training in advanced economic theory, econometrics, and data science."},"url":"msc-economics-and-data-science/2027-28/sep","courseType":{"url_fragment":"postgraduate"}}],"variants":[],"groupedYears":[{"label":"Year 1","number":"1U","cma_accreditation":null,"cma_structure":"\u003cdiv class=\"OutlineElement Ltr SCXW75390367 BCX4\"\u003e\r\n\u003cp class=\"Paragraph SCXW75390367 BCX4\"\u003e\u003cspan class=\"NormalTextRun SCXW75390367 BCX4\"\u003eThis MSc in Economics \u003c/span\u003e\u003cspan class=\"TextRun SCXW75390367 BCX4\" lang=\"EN-GB\" xml:lang=\"EN-GB\" data-contrast=\"none\"\u003e\u003cspan class=\"NormalTextRun SCXW75390367 BCX4\"\u003eis a 12-month course, \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW75390367 BCX4\"\u003ecommencing\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW75390367 BCX4\"\u003e with the pre-sessional course in September.\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"EOP Selected SCXW75390367 BCX4\" data-ccp-props=\"{\u0026quot;335559738\u0026quot;:240,\u0026quot;335559739\u0026quot;:240}\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\r\n\u003c/div\u003e\r\n\u003cdiv class=\"OutlineElement Ltr SCXW75390367 BCX4\"\u003e\r\n\u003cp class=\"Paragraph SCXW75390367 BCX4\"\u003e\u003cspan class=\"TextRun SCXW75390367 BCX4\" lang=\"EN-US\" xml:lang=\"EN-US\" data-contrast=\"auto\"\u003e\u003cspan class=\"NormalTextRun SCXW75390367 BCX4\"\u003eYou\u0026rsquo;ll\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW75390367 BCX4\"\u003e receive rigorous training in core areas of economics, including microeconomics and econometric theory, followed by modules in macroeconomics and applied econometrics. \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW75390367 BCX4\"\u003eYou\u0026rsquo;ll\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW75390367 BCX4\"\u003e also \u003c/span\u003e\u003cspan class=\"NormalTextRun AdvancedProofingIssueV2Themed SCXW75390367 BCX4\"\u003ehave the opportunity to\u003c/span\u003e \u003cspan class=\"NormalTextRun SCXW75390367 BCX4\"\u003ecustomise\u003c/span\u003e \u003cspan class=\"NormalTextRun ContextualSpellingAndGrammarErrorV2Themed SCXW75390367 BCX4\"\u003eyour\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW75390367 BCX4\"\u003e learning by selecting specialist modules that align with your interests and career goals.\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"EOP Selected SCXW75390367 BCX4\" data-ccp-props=\"{\u0026quot;335559738\u0026quot;:240,\u0026quot;335559739\u0026quot;:240}\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\r\n\u003c/div\u003e\r\n\u003cdiv class=\"OutlineElement Ltr SCXW75390367 BCX4\"\u003e\r\n\u003cp class=\"Paragraph SCXW75390367 BCX4\"\u003e\u003cspan class=\"TextRun SCXW75390367 BCX4\" lang=\"EN-US\" xml:lang=\"EN-US\" data-contrast=\"auto\"\u003e\u003cspan class=\"NormalTextRun SCXW75390367 BCX4\"\u003eTo prepare for your dissertation, \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW75390367 BCX4\"\u003eyou\u0026rsquo;ll\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW75390367 BCX4\"\u003e attend a series of training lectures covering how to choose a topic, access data, conduct literature reviews, and \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW75390367 BCX4\"\u003eanalyse\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW75390367 BCX4\"\u003e quantitative data. \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW75390367 BCX4\"\u003eYou\u0026rsquo;ll\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW75390367 BCX4\"\u003e also \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW75390367 BCX4\"\u003ebenefit\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW75390367 BCX4\"\u003e from \u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW75390367 BCX4\"\u003eadditional\u003c/span\u003e\u003cspan class=\"NormalTextRun SCXW75390367 BCX4\"\u003e lab-based dissertation workshops.\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"EOP Selected SCXW75390367 BCX4\" data-ccp-props=\"{\u0026quot;335559738\u0026quot;:240,\u0026quot;335559739\u0026quot;:240}\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\r\n\u003c/div\u003e","cma_teach_learn":null,"diet_rank":10,"diet_code":"27-1U1AT1L103101-1","elements":[{"id":"4c8e74ce-ed37-4c54-86e6-18b623a29d30","label":"Compulsory Modules","selection":"M","min_credits":20,"max_credits":20,"modules":{"data":[{"id":"f8d73009-d488-43df-bdd2-1b3158391131","mod_code":"ECO-7001B","mod_name":"APPLIED ECONOMETRICS","mav_name":"APPLIED ECONOMETRICS","mav_cred":20,"ayr_code":"2027/28","show_on_web":false,"overview_part1":"This module builds on econometrics material covered in earlier modules and is divided into two parts:   1) Time series methods (including ARIMA modelling, stationarity testing, ARCH/GARCH models, Volatility Spillover, VARs , Cointegration and VECMs)  2) Microeconometrics (including panel data methods, and models for binary response variables)  There is an emphasis on the practical application of common estimation techniques, with the specialist econometric software package Stata used extensively.","overview_part2":null,"overview_part3":null,"additional_cost":null}]}},{"id":"ae1c2fe0-53b4-4f39-b3c3-bb4f288eb98a","label":"Compulsory Modules","selection":"M","min_credits":20,"max_credits":20,"modules":{"data":[{"id":"8cd1e8ff-d1af-4dff-8c48-8e28e0e7ca9e","mod_code":"ECO-7002A","mod_name":"ECONOMETRIC THEORY","mav_name":"ECONOMETRIC THEORY","mav_cred":20,"ayr_code":"2027/28","show_on_web":false,"overview_part1":"This module focuses on various theoretical aspects within the linear regression framework using matrix algebra, complemented by simulations and applications to provide more intuition. A specialist econometrics software is used throughout, allowing a better understanding of the theoretical material using real world data and simulations.   After a review of fundamental concepts in Econometrics, the module progresses to a detailed discussion of the multiple linear regression model (MLR), focusing on the theory of estimation, inference, and other important issues, such as, model misspecification and models that involve nonlinearities. The properties of the OLS estimator are discussed in detail, and simulated examples show all the adverse consequences on these properties if certain assumptions in the data or the population do not hold. Real world applications are considered, discussing whether these assumption hold in reality. For example, the presence and consequences of having non-spherical errors is discussed, focusing on the problem of heteroscedasticity. Moreover, special attention is paid on the problem of  endogeneity, while the instrumental variable approach is presented as the main strategy to deal with it.","overview_part2":null,"overview_part3":null,"additional_cost":null}]}},{"id":"b76373c8-2a97-4442-a606-52b5fda39a66","label":"Compulsory Modules","selection":"M","min_credits":20,"max_credits":20,"modules":{"data":[{"id":"6d3f784d-a27f-4000-9d87-0e65c5447761","mod_code":"ECO-7003A","mod_name":"MICROECONOMICS","mav_name":"MICROECONOMICS","mav_cred":20,"ayr_code":"2027/28","show_on_web":false,"overview_part1":"This is an advanced module in microeconomic theory, designed for postgraduate students with a strong background in economics. The topics covered in this module include the duality approach to demand theory, firm theory, general equilibrium theory, game theory, choice under uncertainty, agency theory and the economics of asymmetric information. The rational-choice foundations of microeconomics are also critically examined.","overview_part2":null,"overview_part3":null,"additional_cost":null}]}},{"id":"644d42f5-c25d-4792-97b2-995c1c07d635","label":"Compulsory Modules","selection":"M","min_credits":20,"max_credits":20,"modules":{"data":[{"id":"3a5c292d-0a89-4763-8229-55908edb5790","mod_code":"ECO-7019B","mod_name":"MACROECONOMICS","mav_name":"MACROECONOMICS","mav_cred":20,"ayr_code":"2027/28","show_on_web":false,"overview_part1":"IN TAKING THIS MODULE YOU CANNOT TAKE ECO-7016B IT IS RECOMMENDED THAT STUDENTS TAKE ECO-7003A IN THE AUTUMN SEMESTER.   The module is about modern macroeconomic theory where economies and not their parts are studied. The focus is consequently on the overall performance of the economy rather than on the functioning of particular parts of the economy. The module uses dynamic general equilibrium models where consumers, firms and governments are modelled as forward-looking agents who make the best of the economic environment they live in.","overview_part2":null,"overview_part3":null,"additional_cost":null}]}},{"id":"5ec346f3-67da-4bad-8664-26a6b3f26979","label":"Compulsory Modules","selection":"M","min_credits":60,"max_credits":60,"modules":{"data":[{"id":"a40e5440-6d0a-4c3d-bb97-7f329e44ce6a","mod_code":"ECO-7023X","mod_name":"DISSERTATION/EXTERNAL CONSULTANCY","mav_name":"DISSERTATION/EXTERNAL CONSULTANCY","mav_cred":60,"ayr_code":"2027/28","show_on_web":false,"overview_part1":"Economics Dissertation is the “icing on the cake” of an Economics MSc. It is a module that brings together the skills that you have learnt throughout your degree programme and applies these skills to study a particular topic of your interest. This module gives you an opportunity to spend a period of 2 or 3 months working exclusively on a topic of your own choice, at your own pace, with guidance from a supervisor. The module commences with a sequence of “dissertation training” lectures during the Spring Semester, including such themes as choosing a topic, accessing data, searching the literature, referencing, and qualitative data analysis. There are further dissertation training lectures during late June and early July, held in computer labs, with the objective of providing the types of econometric skills often required in dissertation research. The Econometric software STATA is used, the same as used in taught modules in Econometrics. At the end of the Spring semester, you will submit a research proposal stating the research question you would like to address and proposing a suitable methodology. You can also select to work on a dissertation topic either with a business, charity, or other organization. In all cases, it is your responsibility to come up with a research proposal although you are encouraged to speak with instructors and the PG Course Director for advice and guidance.  On the basis of your proposal, a suitable supervisor will be allocated to you. At least three meetings with the supervisor should take place between May - July. The total contact time over these meetings should be at least three hours. At the first meeting, the research proposal is discussed. By the time of the third and final meeting, you should ideally have supplied a first draft of the dissertation for your supervisor to provide feedback on. The deadline for the dissertation is at the end of August and the word limit for dissertations is either 8,000 or 12,000, depending on which MSc you are taking. If you want to work on a dissertation topic with a business, charity, or other organization you must get your dissertation topic pre-approved by the PG Course Director.","overview_part2":null,"overview_part3":null,"additional_cost":null}]}},{"id":"5324be42-1e25-456f-a94b-95c6b0b8099b","label":"Optional A Modules","selection":"A","min_credits":20,"max_credits":20,"modules":{"data":[{"id":"0f503a95-c466-470e-9982-6c16b28eed5e","mod_code":"ECO-7031A","mod_name":"FINANCIAL MARKETS","mav_name":"FINANCIAL MARKETS","mav_cred":20,"ayr_code":"2027/28","show_on_web":false,"overview_part1":"This module gives a practical introduction to portfolio construction and asset pricing. Topics covered include the efficient markets hypothesis, modern portfolio theory, risk management, asset pricing and behavioural finance. You will learn how to test technical trading rules and build portfolio opportunity sets using the Python pandas package and construct portfolios using Excel’s nonlinear optimisation library. You will learn how to measure risk in asset and insurance portfolios and how to decompose risk into its systematic and diversifiable components using modern assert-pricing theory. Finally, you will learn how to analyse problems using recent advances in behavioural finance.","overview_part2":null,"overview_part3":null,"additional_cost":null},{"id":"e1419792-36fe-42c8-a7c0-756d83ee7341","mod_code":"ECO-7026A","mod_name":"PROGRAMMING AND ANALYTICS FOR BEHAVIOURAL ECONOMISTS","mav_name":"PROGRAMMING AND ANALYTICS FOR BEHAVIOURAL ECONOMISTS","mav_cred":20,"ayr_code":"2027/28","show_on_web":false,"overview_part1":"Do you want to take advantage of the wealth of data available on decision-making and behaviour, and be able to draw insights from it using drawn from econometrics and machine learning? Working with large, diverse and often heterogeneous sources of data, and using those data to produce robust, reproducible results that can be shared with teammates, colleagues, and external stakeholders requires moving beyond spreadsheets to writing code. Whether you have never written a line of computer code before, or have some experience but want to deepen and broaden your skills, this module will teach you current best practices for going from raw data to results. In weekly hands-on workshops, we will guide you through using the state-of-the-art libraries and frameworks in Python, the programming language of choice for data scientists, to automate tasks commonly faced by analysts and data scientists, with special attention to data collection, data wrangling, visualisation, and preparation of data for further analysis. By working through real data science tasks, you will develop skills and good habits informed by professional software and data engineering practices. At the end of the module, you’ll be prepared with the practical skills to take econometric and machine learning techniques to real data on the course, and to be part of teams responsible for generating insights and making decisions informed by rich datasets on behaviour.","overview_part2":null,"overview_part3":null,"additional_cost":null},{"id":"ecc4ac7a-2144-45d4-9569-8d4a7e466e0d","mod_code":"ECO-7008A","mod_name":"FINANCE","mav_name":"FINANCE","mav_cred":20,"ayr_code":"2027/28","show_on_web":false,"overview_part1":"Have you ever wondered why firms buy other firms, or why that trendy technology firm recently issued some shares? Why stock prices go up (and down)? What do we know about financial markets and, importantly, what don’t we understand?  This module introduces a range of concepts related to the financial decisions firms have to make, and how these decisions lead to the existence of the stock markets that feature in the daily news.  The early part of the module introduces the subject area by considering a range a fundamental concepts. From this foundation, you’ll learn how firms make financial decisions and how these decisions are interrelated. The later part of the module investigates how stock markets work, the risks involved, and the extent to which these risks can be avoided.  On successful completion of the module, you’ll have gained the knowledge and skills for setting out on a career in finance, or for further study of corporate finance and financial markets. You’ll better understand financial news and be better-placed to discuss it, drawing on discussion from academic literature. You’ll be able to discuss and answer the sorts of questions prospective employers, friends and family might reasonably ask a finance postgraduate.","overview_part2":null,"overview_part3":null,"additional_cost":null}]}},{"id":"75182122-aa79-48e7-917c-31a54915e188","label":"Optional B Modules","selection":"B","min_credits":20,"max_credits":20,"modules":{"data":[{"id":"0ef34f07-52a9-4e3e-87d3-0074ff7de98a","mod_code":"ECO-7015B","mod_name":"INTERNATIONAL FINANCE","mav_name":"INTERNATIONAL FINANCE","mav_cred":20,"ayr_code":"2027/28","show_on_web":false,"overview_part1":"This module introduces you to the structure and operation of international financial markets, with a focus on exchange rate determination, the foreign exchange market, and key instruments such as futures, forwards, and bonds. Foreign exchange rate market is one the most fascinating financial markets as it is open 24 hours during weekdays, and in this module, you will uncover all these unique characteristics. The module applies theory to practice through real-world case studies, including financial crises and behavioural finance as well as sustainable finance. By the end, you will be able to critically assess international markets and apply financial theories to global economic challenges.","overview_part2":null,"overview_part3":null,"additional_cost":null},{"id":"0fb044e1-49e4-411f-bced-64bf2b857723","mod_code":"ECO-7027B","mod_name":"BEHAVIOURAL CONSUMER ANALYTICS","mav_name":"BEHAVIOURAL CONSUMER ANALYTICS","mav_cred":20,"ayr_code":"2027/28","show_on_web":false,"overview_part1":"Consumers play a critical role in any economy. But why do they buy what they buy? Can we predict what they will consume? Can we influence what they will choose? This module explores how insights from behavioural economics can help us analyse and understand consumer behaviour. The module commences by covering the standard model of consumer behaviour, and the potential for behavioural economics to enrich the model. An array of topics from Behavioural Economics and Consumer Behaviour are then covered, including: values, attitudes and preferences; discrete choice experiments; experimental design; revealed preference; econometric models for choice between discrete alternatives; estimation of demand parameters using purchaser data; decision-making under risk; mental accounting and information; intertemporal choice; suboptimal consumer choice; choice architecture; and behavioural finance.","overview_part2":null,"overview_part3":null,"additional_cost":null},{"id":"795ba24a-a1ca-4142-9d85-ae24a5bd6b1a","mod_code":"ECO-7020B","mod_name":"ENVIRONMENTAL AND NATURAL RESOURCE ECONOMICS","mav_name":"ENVIRONMENTAL AND NATURAL RESOURCE ECONOMICS","mav_cred":20,"ayr_code":"2027/28","show_on_web":false,"overview_part1":"Gain a thorough grounding in the key issues in environmental and resource economics, from pollution to critical materials, biodiversity to climate change. This module provides an overview of the economic principles and methods that serve as pivotal tools in ensuring that natural resources are sustainably managed in a global economic environment. Open to postgraduate students enrolled on both ATP and APP programmes, this module brings economic thinking to bear on the most important challenge of our times: reconciling economic development and sustainability.","overview_part2":null,"overview_part3":null,"additional_cost":null},{"id":"b94053d3-3c4f-4b91-850b-86f483858460","mod_code":"ECO-7030B","mod_name":"ECONOMIC APPLICATIONS OF DATA SCIENCE (EDS)","mav_name":"ECONOMIC APPLICATIONS OF DATA SCIENCE (EDS)","mav_cred":20,"ayr_code":"2027/28","show_on_web":false,"overview_part1":"The module aims to develop and reinforce in students appropriate skills that are required to tackle complex data science projects in economics using, the open source statistical software package, Python. The aim of this module is not to provide students with in-depth knowledge of any programming language per se. Rather, this module aims to teach students the fundamentals of programming, data management, data analysis, data visualization and machine learning techniques. These are techniques that students will find useful and relevant for the job market/any economic research involving data. The ability to solve problems using data and help students to “think with data” is the driving philosophy behind this module.   This module will form an integral part of a two-module sequence involving the PGT module, Programming and Analytics for Behavioural Economists, ECO-7026A, or PABE. PABE will be a pre-requisite for EDS. Students will be taking PABE in Autumn followed by EDS in Spring. The aim of EDS will be to extend the knowledge students acquire in PABE, and focus on applications of the techniques to Economic problems. EDS will therefore build on and expand the breadth of skills acquired in PABE.","overview_part2":null,"overview_part3":null,"additional_cost":null},{"id":"c0f52afe-5f47-48f9-88cc-c50db2ff3292","mod_code":"ECO-7013B","mod_name":"FINANCIAL MATHEMATICS","mav_name":"FINANCIAL MATHEMATICS","mav_cred":20,"ayr_code":"2027/28","show_on_web":false,"overview_part1":"This is a technical finance module and ideal if you are wishing to pursue a career in the financial sector. The focus will be on derivatives valuation and  use of derivatives for both hedging and speculation purposes. The module will be highly analytical, with workshop sessions in Python. The module is highly practical and integral part of it is futures trading exercise. Topics covered will include: bonds; futures/ forwards; options (incl real options); swaps; hedging; VaR; continuous time stochastic processes and calculus; and stochastic models of security prices.","overview_part2":null,"overview_part3":null,"additional_cost":null}]}}]}],"entryRequirements":[{"head":"This course is open to","body":"\u003cdiv class=\"OutlineElement Ltr SCXW263323043 BCX0\"\u003e\r\n\u003cp class=\"Paragraph SCXW263323043 BCX0\"\u003e\u003cspan class=\"TextRun SCXW263323043 BCX0\" lang=\"EN-GB\" xml:lang=\"EN-GB\" data-contrast=\"auto\"\u003e\u003cspan class=\"NormalTextRun SCXW263323043 BCX0\" data-ccp-charstyle=\"eop\" data-ccp-charstyle-defn=\"{\u0026quot;ObjectId\u0026quot;:\u0026quot;79474d22-7bb9-48b5-9eea-fd44c418c667|235\u0026quot;,\u0026quot;ClassId\u0026quot;:1073872969,\u0026quot;Properties\u0026quot;:[469775450,\u0026quot;eop\u0026quot;,201340122,\u0026quot;1\u0026quot;,134233614,\u0026quot;true\u0026quot;,469778129,\u0026quot;eop\u0026quot;,335572020,\u0026quot;1\u0026quot;,469778324,\u0026quot;Default Paragraph Font\u0026quot;]}\"\u003eUK and International fee-paying students. Choose UK or International above to see relevant information. The entry point is in September each year.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003c/div\u003e\r\n\u003cdiv class=\"OutlineElement Ltr SCXW263323043 BCX0\"\u003e\r\n\u003cp class=\"Paragraph SCXW263323043 BCX0\"\u003e\u0026nbsp;\u003c/p\u003e\r\n\u003c/div\u003e","sequence":0,"tab_name":["international","uk"],"id":"c69621cc-8ae2-4749-8b55-323381e83744"},{"head":"Typical UK Entry Requirements","body":"\u003ch3\u003eDegree classification\u003c/h3\u003e\r\n\u003cp\u003eBachelors degree - 2.2\u003c/p\u003e\r\n\u003ch3\u003eDegree Subject\u003c/h3\u003e\r\n\u003cp\u003eEconomics\u003c/p\u003e","sequence":1,"tab_name":["uk"],"id":"6cac58f3-08c5-4f79-ad2e-bf106a69a966"},{"head":"Typical International  Entry Requirements","body":"\u003ch3\u003eDegree classification\u003c/h3\u003e\r\n\u003cp\u003eUK Bachelors degree - 2.2 or equivalent\u0026nbsp;\u003c/p\u003e\r\n\u003ch3\u003eDegree Subject\u003c/h3\u003e\r\n\u003cp\u003eEconomics\u003c/p\u003e","sequence":2,"tab_name":["international"],"id":"12c27a06-ff35-4594-878b-b50ee824cf6d"},{"head":"Additional Entry Requirements","body":"\u003cp\u003e[copy from the current Additional entry requirements.\u0026nbsp; If not applicable turn toggles off]\u003c/p\u003e","sequence":3,"tab_name":[],"id":"ac32a331-bd10-4349-8f82-877fa6617bfd"},{"head":"English and Mathematics","body":"\u003cp\u003e\u003cspan class=\"TextRun SCXW69449085 BCX0\" lang=\"EN-GB\" xml:lang=\"EN-GB\" data-contrast=\"auto\"\u003e\u003cspan class=\"NormalTextRun SCXW69449085 BCX0\" data-ccp-charstyle=\"eop\" data-ccp-charstyle-defn=\"{\u0026quot;ObjectId\u0026quot;:\u0026quot;79474d22-7bb9-48b5-9eea-fd44c418c667|235\u0 69777804\u0026quot;:\u0026quot;\u0026quot;,\u0026quot;469777815\u0026quot;:\u0026quot;hybridMultilevel\u0026quot;}\" data-listid=\"3\"\u003e\r\n\u003cp\u003eIELTS: 6.0 overall (minimum 5.5 in each component).\u003c/p\u003e\r\n\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003eWe also accept a number of other English language tests. Review our\u0026nbsp;\u003ca href=\"https://www.uea.ac.uk/apply/our-admissions-policy/english-language-equivalencies\" target=\"_blank\" rel=\"noopener\"\u003eEnglish Language Equivalencies\u003c/a\u003e for a list of example qualifications that we may accept to meet this requirement.\u0026nbsp;\u003c/p\u003e\r\n\u003cp\u003eTest dates should be within two years of the course start date.\u0026nbsp;\u003c/p\u003e\r\n\u003cp\u003eIf you do not meet the English language requirements for this course, our\u0026nbsp;\u003ca href=\"https://ueaisc.com/en\"\u003eUEA International Study Centre\u003c/a\u003e offers a variety of English language programmes which are designed to help you develop the required English skills.\u0026nbsp;\u003c/p\u003e\r\n\u003cp\u003e\u003ca href=\"https://ueaisc.com/en/courses/pre-sessional-english\"\u003ePre-Sessional English\u003c/a\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003ca href=\"https://ueaisc.com/en/courses/online-pre-sessional-english\"\u003eOnline Pre-Sessional English\u0026nbsp;\u003c/a\u003e\u003c/p\u003e","sequence":6,"tab_name":["international"],"id":"42a568e1-bc5b-49af-a7aa-1fa80e0bdb2a"},{"head":"UEA International Study Centre","body":"\u003cp\u003eIf you do not meet the academic requirements for this course, you may be able to study the International Pre-Masters programme offered by our partner UEA International Study Centre. This programme guarantees progression to selected Master's degrees if students achieve the appropriate grade. For more details, please click here: \u0026nbsp;\u003c/p\u003e\r\n\u003cp\u003e\u003ca href=\"https://ueaisc.com/en/courses/pre-masters-in-business-economics-and-social-sciences\" target=\"_blank\" rel=\"noopener\"\u003eInternational Pre-Masters in Business, Economics and Social Sciences\u003c/a\u003e \u0026nbsp;\u003c/p\u003e","sequence":7,"tab_name":[],"id":"b1318516-21e4-4fa7-8290-291c19f83a27"},{"head":"Interviews","body":"\u003cp\u003e[Copy current interview text from course page. \u0026nbsp;If not applicable turn toggles off]\u003c/p\u003e","sequence":8,"tab_name":[],"id":"80cfeb8d-59a7-4c04-8b57-f9e246364205"},{"head":"Placements","body":"\u003cp\u003e[copy and paste info from current course page. If not applicable turn toggles off]\u003c/p\u003e","sequence":9,"tab_name":[],"id":"d957f8c5-706b-410d-a482-e87f3ad3d360"},{"head":"Admissions Policy","body":"\u003cp\u003eOur\u0026nbsp;\u003ca href=\"https://www.uea.ac.uk/apply/our-admissions-policy\"\u003eAdmissions Policy\u003c/a\u003e applies to the admissions of all postgraduate applicants.\u003c/p\u003e","sequence":10,"tab_name":["international","uk"],"id":"b962052c-9fd9-49ce-a326-cdd1ba21c414"}],"show_until":"2028-09-25 00:00:00"},"chooseUsData":[]},"__N_SSG":true},"page":"/[...slug]","query":{"slug":["msc-economics"]},"buildId":"iVmR86qRIpRkmuTCdh2O1","assetPrefix":"/course","isFallback":false,"isExperimentalCompile":false,"gsp":true,"scriptLoader":[]}</script><script id="google-tag-manager" nonce="" data-nscript="afterInteractive">(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
